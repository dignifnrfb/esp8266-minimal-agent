[platformio]
default_envs = minimal_agent

[env:minimal_agent]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_src_filter = -<*> +<minimal/>
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
upload_speed = 460800
monitor_speed = 115200
; Preserve the deployed platform/core, linker layout, CPU and TLS heap flags.
; The TFT dependencies are exact reviewed official release versions.
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.16.1
; Seesaw/SD are metadata dependencies used only by unused examples/TFTShield.
; This driver uses no SD, seesaw, I2C, or additional GPIO.
lib_ignore =
    Adafruit seesaw Library
    SD
build_flags =
    -D ARDUINOJSON_USE_LONG_LONG=1
    -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
